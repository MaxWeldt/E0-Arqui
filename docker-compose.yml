version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    container_name: energy_db
    environment:
      POSTGRES_USER: maxweldt
      POSTGRES_PASSWORD: maxweldt2004
      POSTGRES_DB: energy_shark
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxweldt -d energy_shark"]
      interval: 10s
      timeout: 5s
      retries: 5

  master:
    build: .
    container_name: energy_master
    command: node index.js
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/history"]
      interval: 15s
      timeout: 5s
      retries: 3

  connector:
    build: .
    container_name: energy_connector
    command: node connector.js
    depends_on:
      master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[n]ode connector.js' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
  
  nginx:
    image: nginx:alpine
    container_name: energy_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      master:
        condition: service_healthy